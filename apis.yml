name: Mint
description: 'Mint was a personal finance, budgeting, and money-management product
  originally built by Aaron Patzer and backed by First Round Capital and Uncork Capital
  (then SoftTech VC) before its 2009 acquisition by Intuit. Intuit shut the standalone
  Mint service down and reimagined its features (transaction review, spending tracking,
  net-worth monitoring, account linking across 17,000+ financial institutions) inside
  Credit Karma. Mint exposes no public developer API, developer portal, or API reference;
  this profile is retained as a network company record. Sector: fintech.'
